name: Cloud BDS checks
on:
  workflow_dispatch:
  push:
    paths: ['scripts/cloud/**', '.github/workflows/cloud-bds.yml']
  pull_request:
    paths: ['scripts/cloud/**', '.github/workflows/cloud-bds.yml']
permissions:
  contents: read
jobs:
  image-only-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/cloud/requirements.txt
      - run: python scripts/cloud/test_bds_visual.py
      - run: python scripts/cloud/test_original_base.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/cloud/check-original-base.mjs
      - run: npm run test:effects
      - run: npm run test:mist
      - name: Check native star and toolbar package
        run: |
          node scripts/cloud/build-mist-lilac.mjs --output artifacts/ci-mist
          python scripts/cloud/star_pop.py artifacts/ci-mist/mist-lilac.bds artifacts/ci-star --prominent
          node scripts/cloud/check-star-pop.mjs artifacts/ci-mist/mist-lilac.bds artifacts/ci-star/mist-star-12.bds
          python scripts/cloud/add_native_toolbar.py artifacts/ci-star/mist-star-12.bds artifacts/ci-toolbar
          node scripts/cloud/check-toolbar.mjs artifacts/ci-star/mist-star-12.bds artifacts/ci-toolbar/mist-star-toolbar-13.bds
